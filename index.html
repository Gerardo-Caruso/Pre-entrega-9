<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-entrega 9</title>
    <!-- Bootstrap CSS primero -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tus estilos después -->
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">TIENDA TECNO</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
  <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
</svg><i class="bi bi-cart"></i></a>
            </li>
          </ul>
          <form class="d-flex" role="search" id="form-busqueda">
            <input class="form-control me-2" type="search" placeholder="Buscar..." id="input-busqueda" aria-label="Search"/>
            <button class="btn btn-outline-success" type="submit">Buscar</button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Contenedor dinámico de productos -->
    <main class="container my-4">
      

      <!-- Contenedor donde va el ejemplo para el setTimeout() -->
    <div id="mensaje-promo"></div>
      
      <section id="productos" class="row g-3">

    <!-- Spinner para simular carga -->
      <div id="loader" class="spinner-container">
        <div class="spinner"></div>
        <p>Cargando productos...</p>
      </div>
      
      </section>
      

      <section id="carrito"></section>
      
      <section>
        <h3>Agregar producto</h3>
        <form id="form-agregar-producto" class="form-agregar-producto">
          <input
            type="text"
            name="nombre"
            placeholder="Nombre del producto"
            id="input-nombre"
          />
          <input
            type="number"
            name="precio"
            placeholder="Precio del producto"
            id="input-precio"
          />
          <input
            type="text"
            name="imagen"
            placeholder="URL de la imagen del producto"
            id="input-imagen"
          />
          <input
            type="text"
            name="descripcion"
            placeholder="Descripcion del producto"
            id="input-descripcion"
          />
          <input type="submit" value="Agregar producto" />
        </form>
      </section>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
